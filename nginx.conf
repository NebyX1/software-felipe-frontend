log_format privacy '$remote_addr $request_method $status $body_bytes_sent $request_time';
map $http_x_forwarded_proto $obras_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
server {
    access_log /var/log/nginx/access.log privacy;
    listen 0.0.0.0:80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    # Re-resolve a replaced backend container during independent redeployments.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $obras_backend ${BACKEND_URL};
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_ssl_verify_depth 3;
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }
    location ^~ /api/ {
        proxy_pass $obras_backend;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $obras_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location ~ ^/(admin(?:/|$)|static/) {
        proxy_pass $obras_backend;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $obras_forwarded_proto;
    }

    # -------------------------------------------------------
    # Compresión gzip
    # -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------
    # Assets estáticos hasheados — caché 1 año (inmutable)
    # -------------------------------------------------------
    location ~* \.(js|css|woff|woff2|ttf|eot|otf|ico|webp|png|jpg|jpeg|gif|svg|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # -------------------------------------------------------
    # Health check para Coolify / Docker
    # -------------------------------------------------------
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------
    # index.html — nunca cachear agresivamente
    # -------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # -------------------------------------------------------
    # SPA fallback — React Router maneja el routing en el cliente
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # Seguridad básica
    # -------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
